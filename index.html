<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector Flipbook PDF</title>
  
  <!-- Estilos para el visor y controles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Barra de herramientas superior */
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .controls button {
      background-color: #444;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .controls button:hover {
      background-color: #666;
    }

    .page-info {
      font-size: 14px;
      color: #ccc;
    }

    /* Contenedor principal del Flipbook */
    .flipbook-container {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: calc(100vh - 60px);
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none; /* Se muestra al terminar de cargar */
    }

    /* Pantalla de carga */
    #loading {
      font-size: 18px;
      color: #aaa;
    }
  </style>

  <!-- PDF.js para procesar el PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Page-Flip para la animación 3D de las páginas -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- Barra de Navegación -->
  <div class="controls">
    <button id="prev-btn">◀ Anterior</button>
    <span class="page-info">Página <span id="page-num">1</span> de <span id="page-count">-</span></span>
    <button id="next-btn">Siguiente ▶</button>
  </div>

  <!-- Contenedor del Libro -->
  <div class="flipbook-container">
    <div id="loading">Cargando PDF y generando Flipbook...</div>
    <div id="flipbook"></div>
  </div>

  <script>
    // Configurar la URL de tu PDF (Asegúrate de poner aquí la ruta de tu archivo)
    const pdfUrl = 'mi_libro.pdf'; 

    // Configurar worker de PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;

    async function initFlipbook() {
      try {
        // 1. Cargar el documento PDF
        const pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        const totalPages = pdfDoc.numPages;
        document.getElementById('page-count').textContent = totalPages;

        const flipbookContainer = document.getElementById('flipbook');

        // 2. Renderizar cada página del PDF en elementos Canvas de HTML
        for (let num = 1; num <= totalPages; num++) {
          const page = await pdfDoc.getPage(num);
          
          // Escala del renderizado (ajusta la resolución/calidad de la página)
          const viewport = page.getViewport({ scale: 1.5 });
          
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          // Añadir el canvas renderizado al contenedor del flipbook
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';
          pageDiv.appendChild(canvas);
          flipbookContainer.appendChild(pageDiv);
        }

        // Ocultar mensaje de carga y mostrar el flipbook
        document.getElementById('loading').style.display = 'none';
        flipbookContainer.style.display = 'block';

        // 3. Inicializar la librería PageFlip
        pageFlip = new St.PageFlip(flipbookContainer, {
          width: 550, // Ancho de una sola página en px
          height: 733, // Alto de una página en px
          size: "fixed",
          minWidth: 315,
          maxWidth: 1000,
          minHeight: 420,
          maxHeight: 1350,
          maxShadowOpacity: 0.5, // Sombra del pliegue de página
          showCover: true, // Si es true, la primera página actúa como portada individual
          mobileScrollSupport: false
        });

        // Cargar los elementos .page creados previamente
        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        // Evento para actualizar el número de página actual en la interfaz
        pageFlip.on('flip', (e) => {
          document.getElementById('page-num').textContent = e.data + 1;
        });

      } catch (error) {
        console.error('Error al cargar el PDF:', error);
        document.getElementById('loading').textContent = 'Error al cargar el archivo PDF. Verifica el nombre/ruta del archivo.';
      }
    }

    // Controles de botones
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipNext();
    });

    // Iniciar el proceso
    initFlipbook();
  </script>
</body>
</html>
