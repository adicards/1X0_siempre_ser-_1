<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector Flipbook PDF con Subrayador</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra de herramientas */
    .controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background-color: #2b2b2b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .controls button {
      background-color: #444;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .controls button:hover {
      background-color: #666;
    }

    /* Estilo del botón activo para subrayar */
    .controls button.active {
      background-color: #ffd700;
      color: #000;
      border-color: #cca300;
    }

    .page-info {
      font-size: 14px;
      color: #ccc;
    }

    /* Contenedor principal ajustado a la pantalla */
    .flipbook-container {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: calc(100vh - 70px);
      padding: 10px;
    }

    #flipbook {
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none;
    }

    .page {
      position: relative;
      background-color: #fff;
    }

    /* Canvas para renderizar el PDF */
    .page canvas.pdf-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Capa superior interactiva para dibujar/subrayar */
    .page canvas.draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: default;
    }

    .page canvas.draw-canvas.drawing-mode {
      cursor: crosshair;
    }

    #loading {
      font-size: 18px;
      color: #aaa;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- Controles -->
  <div class="controls">
    <button id="prev-btn">◀ Anterior</button>
    <span class="page-info">Página <span id="page-num">1</span> de <span id="page-count">-</span></span>
    <button id="next-btn">Siguiente ▶</button>
    
    <!-- Herramienta de Subrayado -->
    <button id="highlight-btn">🖍️ Modos Subrayador (Desactivado)</button>
    <button id="clear-btn">🗑️ Limpiar Marcas</button>
  </div>

  <div class="flipbook-container">
    <div id="loading">Cargando PDF...</div>
    <div id="flipbook"></div>
  </div>

  <script>
    const pdfUrl = 'mi_libro.pdf'; // Tu archivo PDF

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pageFlip = null;
    let isHighlightMode = false;

    async function initFlipbook() {
      try {
        const pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        const totalPages = pdfDoc.numPages;
        document.getElementById('page-count').textContent = totalPages;

        const flipbookContainer = document.getElementById('flipbook');

        for (let num = 1; num <= totalPages; num++) {
          const page = await pdfDoc.getPage(num);
          const viewport = page.getViewport({ scale: 1.5 });

          // Div contenedor de la página
          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          // 1. Canvas para el PDF
          const pdfCanvas = document.createElement('canvas');
          pdfCanvas.className = 'pdf-canvas';
          pdfCanvas.height = viewport.height;
          pdfCanvas.width = viewport.width;

          const context = pdfCanvas.getContext('2d');
          await page.render({ canvasContext: context, viewport: viewport }).promise;

          // 2. Canvas para el Subrayador (superpuesto)
          const drawCanvas = document.createElement('canvas');
          drawCanvas.className = 'draw-canvas';
          drawCanvas.height = viewport.height;
          drawCanvas.width = viewport.width;

          // Habilitar dibujo en la capa superior
          enableHighlighting(drawCanvas);

          pageDiv.appendChild(pdfCanvas);
          pageDiv.appendChild(drawCanvas);
          flipbookContainer.appendChild(pageDiv);
        }

        document.getElementById('loading').style.display = 'none';
        flipbookContainer.style.display = 'block';

        // Inicializar PageFlip con modo STRETCH (Ajuste flexible según la pantalla)
        pageFlip = new St.PageFlip(flipbookContainer, {
          width: 550,
          height: 733,
          size: "stretch", // Hace que se escale dinámicamente sin salirse
          minWidth: 300,
          maxWidth: 1000,
          minHeight: 400,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,
          useMouseEvents: true // Permite pasar página al arrastrar
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        pageFlip.on('flip', (e) => {
          document.getElementById('page-num').textContent = e.data + 1;
        });

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('loading').textContent = 'Error al cargar el archivo PDF.';
      }
    }

    // Lógica del marcador/subrayador
    function enableHighlighting(canvas) {
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: ((e.clientX || e.touches[0].clientX) - rect.left) * scaleX,
          y: ((e.clientY || e.touches[0].clientY) - rect.top) * scaleY
        };
      }

      function startDrawing(e) {
        if (!isHighlightMode) return;
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!isDrawing || !isHighlightMode) return;
        e.preventDefault(); // Evitar scroll en touch
        const pos = getPos(e);

        ctx.strokeStyle = 'rgba(255, 235, 59, 0.4)'; // Amarillo translúcido
        ctx.lineWidth = 24; // Ancho del trazo de subrayado
        ctx.lineCap = 'square';
        ctx.lineJoin = 'round';

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDrawing() {
        isDrawing = false;
      }

      // Eventos de ratón
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing);

      // Eventos táctiles
      canvas.addEventListener('touchstart', startDrawing);
      canvas.addEventListener('touchmove', draw);
      canvas.addEventListener('touchend', stopDrawing);
    }

    // Alternar modo subrayador
    const highlightBtn = document.getElementById('highlight-btn');
    highlightBtn.addEventListener('click', () => {
      isHighlightMode = !isHighlightMode;
      const canvases = document.querySelectorAll('.draw-canvas');

      if (isHighlightMode) {
        highlightBtn.classList.add('active');
        highlightBtn.textContent = '🖍️ Subrayador ACTIVADO (Arrastra para marcar)';
        canvases.forEach(c => c.classList.add('drawing-mode'));
        // Desactivar el paso de página arrastrando mientras se subraya
        pageFlip.updateFromSettings({ useMouseEvents: false });
      } else {
        highlightBtn.classList.remove('active');
        highlightBtn.textContent = '🖍️ Modos Subrayador (Desactivado)';
        canvases.forEach(c => c.classList.remove('drawing-mode'));
        // Reorganizar pase de página por arrastre
        pageFlip.updateFromSettings({ useMouseEvents: true });
      }
    });

    // Limpiar subrayados de la vista actual
    document.getElementById('clear-btn').addEventListener('click', () => {
      const activeCanvases = document.querySelectorAll('.draw-canvas');
      activeCanvases.forEach(canvas => {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    });

    // Controles de navegación
    document.getElementById('prev-btn').addEventListener('click', () => pageFlip && pageFlip.flipPrev());
    document.getElementById('next-btn').addEventListener('click', () => pageFlip && pageFlip.flipNext());

    initFlipbook();
  </script>
</body>
</html>
